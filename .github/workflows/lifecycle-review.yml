name: Mobile attachment reference tests
on:
  push:
    branches: [fix/application-attachment-lifecycle, feat/vdgo-snils, fix/mobile-draft-submit]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: attachment-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-tests:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/utils/submission.ts
            /src/utils/currentCheckService.ts
            /src/utils/correctionStep.ts
            /src/utils/aiRequisites.ts
            /src/components/DataEditor/fields/snils.ts
            /src/utils/fileReferences.ts
            /src/utils/attachmentUpload.ts
            /src/utils/attachmentDelete.ts
            /src/Store/api.ts
            /test/lifecycle/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.11.0'
      - name: Confirm isolated checkout and remove history
        shell: powershell
        run: |
          foreach ($path in @('.env', 'mobile.config.js', 'requests.js', 'database.js', 'package.json')) {
            if (Test-Path $path) { throw 'UNEXPECTED_PRODUCTION_SOURCE' }
          }
          Remove-Item -LiteralPath .git -Recurse -Force
      - name: Reference contract tests (no build or production access)
        shell: powershell
        run: |
          $testFiles = @(Get-ChildItem test/lifecycle -Filter '*.test.mjs' | ForEach-Object { $_.FullName })
          node --experimental-strip-types --test @testFiles
          if ($LASTEXITCODE -ne 0) { throw 'TESTS_FAILED' }
